<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Title for the Join screen (the house view has its own header). -->
  <h1 id="join-title">Cozy House</h1>

  <!-- Join screen: shown first, hidden once you click Join. -->
  <div id="join-screen">
    <label>
      Your name:
      <input id="name-input" type="text" maxlength="16" placeholder="e.g. Sam">
    </label>
    <label>
      Your color:
      <input id="color-input" type="color" value="#e05a47">
    </label>
    <label>
      Your hat:
      <select id="hat-input">
        <option value="none">No hat</option>
        <option value="beanie">Beanie</option>
        <option value="cap">Cap</option>
        <option value="bow">Bow</option>
        <option value="headphones">Headphones</option>
        <option value="flower">Flower</option>
      </select>
    </label>
    <!-- A little preview of how you'll look, updated as you pick. -->
    <canvas id="character-preview" width="96" height="96"></canvas>
    <button id="join-button">Join the house</button>
  </div>

  <!-- The house itself: hidden until you join. -->
  <div id="game-screen" hidden>
    <!-- One centered container: a header bar, then the house and the
         sidebar side by side (the sidebar drops below on narrow windows). -->
    <div id="game-container">
      <header id="game-header">
        <h1>Cozy House</h1>
        <span id="room-label">📍 Hallway</span>
      </header>
    <div id="game-layout">
      <div id="house-column">
        <div id="house-wrap">
          <canvas id="house"></canvas>
          <!-- A cozy in-game "are you sure?" card, shown over the house. -->
          <div id="confirm-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <div class="confirm-card">
              <h3 id="confirm-title"></h3>
              <p id="confirm-text"></p>
              <div class="confirm-buttons">
                <button id="confirm-no" class="soft-button"></button>
                <button id="confirm-yes" class="warm-button"></button>
              </div>
            </div>
          </div>
        </div>
        <p id="action-hint"></p>
        <p class="hint">Move with the arrow keys or WASD.</p>
      </div>
      <div id="sidebar">
        <h2>Who's here</h2>
        <ul id="peer-list"></ul>
        <hr>
        <h2>Voice</h2>
        <p id="mic-status" class="hint" hidden>
          Your mic is off, so friends can't hear you (you can still hear them).
          To fix it, click the icon at the left of the address bar, allow the
          microphone, then reload the page.
        </p>
        <label class="voice-row toggle-row">
          Mute everyone
          <span class="toggle">
            <input id="mute-toggle" type="checkbox">
            <span class="toggle-track"></span>
          </span>
        </label>
        <label class="voice-row">
          Volume
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1">
        </label>
        <label class="voice-row">
          Lo-fi volume (Study)
          <input id="lofi-volume-slider" type="range" min="0" max="1" step="0.05" value="0.5">
        </label>
      </div>
    </div>
    </div>
  </div>

  <!-- Holds the hidden lo-fi music player. Tucked off-screen rather
       than display:none, since some browsers pause hidden video. -->
  <div id="lofi-player"></div>

  <!-- Bump this each time we push, so you can tell whether you're
       looking at the latest version or an old cached page. -->
  <p id="version-tag">build 0.23</p>

  <script src="config.js"></script>
  <script src="world.js"></script>
  <script src="render.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
