<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cozy House</h1>

  <!-- Join screen: shown first, hidden once you click Join. -->
  <div id="join-screen">
    <label>
      Your name:
      <input id="name-input" type="text" maxlength="16" placeholder="e.g. Sam">
    </label>
    <label>
      Your color:
      <input id="color-input" type="color" value="#e05a47">
    </label>
    <button id="join-button">Join the house</button>
  </div>

  <!-- The house itself: hidden until you join. -->
  <div id="game-screen" hidden>
    <div id="game-layout">
      <div>
        <p id="room-label">You are in: Hallway</p>
        <p id="action-hint"></p>
        <canvas id="house"></canvas>
        <p class="hint">Move with the arrow keys or WASD.</p>
      </div>
      <div id="sidebar">
        <h2>Who's here</h2>
        <ul id="peer-list"></ul>
        <hr>
        <h2>Voice</h2>
        <label class="voice-row toggle-row">
          Mute everyone
          <span class="toggle">
            <input id="mute-toggle" type="checkbox">
            <span class="toggle-track"></span>
          </span>
        </label>
        <label class="voice-row">
          Volume
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1">
        </label>
        <label class="voice-row">
          Lo-fi volume (Study)
          <input id="lofi-volume-slider" type="range" min="0" max="1" step="0.05" value="0.5">
        </label>
      </div>
    </div>
  </div>

  <!-- Holds the hidden lo-fi music player. Tucked off-screen rather
       than display:none, since some browsers pause hidden video. -->
  <div id="lofi-player"></div>

  <!-- Bump this each time we push, so you can tell whether you're
       looking at the latest version or an old cached page. -->
  <p id="version-tag">build 0.21</p>

  <script src="config.js"></script>
  <script src="world.js"></script>
  <script src="render.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
