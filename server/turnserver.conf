# The Cozy House voice relay (coturn). Installed to /etc/turnserver.conf,
# with __SECRET__ swapped for the TURN_SECRET in /etc/cozy-server.env.
#
# When two friends' home networks can't connect to each other directly,
# their voices and movement go through this relay instead. Logins are
# made by the house server and only last a day (see "use-auth-secret").

# Where it listens: the droplet's public address only (not its private
# network ones), plain (3478, UDP and TCP) and encrypted (5349, TLS).
listening-ip=142.93.3.149
relay-ip=142.93.3.149
listening-port=3478
tls-listening-port=5349
# The ports it relays through (a small range is plenty for a few friends).
min-port=50000
max-port=50500

# Time-limited logins: the house server signs them with this shared secret.
use-auth-secret
static-auth-secret=__SECRET__
realm=api.thecozy.world
fingerprint
stale-nonce=600

# The HTTPS certificate Caddy already gets for api.thecozy.world, copied
# here by cozy-turn-certs (so it renews along with Caddy's).
cert=/etc/coturn/tls/cert.pem
pkey=/etc/coturn/tls/key.pem
no-tlsv1
no-tlsv1_1

# Safety: no admin console, no version shown, no older or riskier STUN
# features, limits on how much one person can use, and no relaying into
# private networks. (The droplet's own public address stays allowed: when
# both friends use the relay, they reach each other through it.)
no-cli
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
no-multicast-peers
user-quota=12
total-quota=100
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Messages go to the system log (sudo journalctl -u coturn).
syslog
simple-log
