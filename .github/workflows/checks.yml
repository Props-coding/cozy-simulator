# The automatic checks: GitHub runs these on every push and pull request,
# on one of its own test machines (free for public projects). A red X on a
# change means something broke; a green tick means these all passed:
#   1. the mistake checker (npm run lint)
#   2. the house loads, and every floor draws without problems (npm test)
# (The before-and-after pictures aren't checked here: GitHub's machines
# draw text a little differently. Claude runs those before each update.)
name: Checks

on:
  # (Changes going live on main, and every pull request. A branch with a
  # pull request open is checked once, through the pull request.)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the developer tools
        run: npm ci
      - name: Mistake checker
        run: npm run lint
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: The house loads and every floor draws
        run: npm test
      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
